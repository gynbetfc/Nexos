<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NEXOS PANEL</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        /* Correções Mobile imediatas inline para garantir a responsividade do layout */
        body { margin: 0; padding: 10px; background: #040a0f; color: #fff; font-family: sans-serif; }
        .topbar-mobile { display: flex; gap: 8px; margin-bottom: 15px; }
        .topbar-mobile input { flex: 1; background: #08131d; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; color: #fff; font-size: 14px; }
        .topbar-mobile button { background: #22c55e; border: none; padding: 0 16px; border-radius: 8px; color: #000; font-weight: bold; font-size: 13px; }
        .card-container { display: flex; flex-direction: column; gap: 12px; }
        .card-box { background: #08131d; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; }
        .card-box h2 { margin: 0 0 10px 0; font-size: 14px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; }
        .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #0f172a; font-size: 13px; }
        .info-row span { color: #94a3b8; }
        .info-row strong { color: #f8fafc; }
        .map-box { height: 280px; border-radius: 8px; background: #020617; margin-top: 8px; z-index: 1; }
        .btn-maps { display: none; background: #0284c7; color: #fff; text-align: center; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 13px; margin-top: 10px; }
        .cam-placeholder { height: 120px; display: flex; align-items: center; justify-content: center; border: 1px dashed #334155; border-radius: 8px; color: #475569; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="topbar-mobile">
        <input id="deviceId" placeholder="DEVICE ID">
        <button id="status" onclick="connectDevice()">CONNECT</button>
    </div>

    <div class="card-container">
        <div class="card-box">
            <h2>Device Status</h2>
            <div id="statusIndicatorCard" style="color: #ef4444; font-weight: bold; font-size: 15px;">● DESCONECTADO</div>
        </div>

        <div class="card-box">
            <h2>Device Info</h2>
            <div class="info-row"><span>ID:</span><strong id="deviceInfo">---</strong></div>
            <div class="info-row"><span>Bateria:</span><strong id="battery">---</strong></div>
            <div class="info-row"><span>Sistema:</span><strong id="android">---</strong></div>
            <div class="info-row"><span>Espaço:</span><strong id="storage">---</strong></div>
            <div class="info-row"><span>Uptime:</span><strong id="uptime">---</strong></div>
        </div>

        <div class="card-box">
            <h2>GPS Localization</h2>
            <div id="map" class="map-box"></div>
            <a id="googleMapsBtn" href="#" target="_blank" class="btn-maps">ABRIR NO GOOGLE MAPS</a>
        </div>

        <div class="card-box">
            <h2>Front Camera</h2>
            <div class="cam-placeholder">STREAM OFF</div>
        </div>

        <div class="card-box">
            <h2>Rear Camera</h2>
            <div class="cam-placeholder">STREAM OFF</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
