<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXOS</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="sidebar">

    <div>

        <h1>NEXOS</h1>

        <div class="menu">

            <div class="menu-item active">
                Dashboard
            </div>

            <div class="menu-item">
                Devices
            </div>

            <div class="menu-item">
                Cameras
            </div>

            <div class="menu-item">
                GPS
            </div>

            <div class="menu-item">
                Settings
            </div>

        </div>

    </div>

    <div class="version">
        v1.0
    </div>

</div>

<div class="main">

    <div class="topbar">

        <input id="deviceId" placeholder="ENTER DEVICE ID">

        <button onclick="connectDevice()">
            CONNECT
        </button>

        <div id="status" class="status offline">
            OFFLINE
        </div>

    </div>

    <div class="grid">

        <div class="card">

            <h2>DEVICE STATUS</h2>

            <div class="device-online">
                ● ONLINE
            </div>

        </div>

        <div class="card">

            <h2>DEVICE INFO</h2>

            <p>ID: <span id="deviceInfo">---</span></p>

        </div>

        <div class="card camera">

            <h2>FRONT CAMERA</h2>

            <div class="placeholder">
                CAMERA STREAM
            </div>

        </div>

        <div class="card camera">

            <h2>REAR CAMERA</h2>

            <div class="placeholder">
                CAMERA STREAM
            </div>

        </div>

        <div class="card">

            <h2>GPS</h2>

            <div class="placeholder">
                MAP
            </div>

        </div>

        <div class="card">

            <h2>SCREEN STREAM</h2>

            <div class="placeholder">
                LIVE SCREEN
            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
