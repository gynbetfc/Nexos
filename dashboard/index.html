<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXOS MOBILE</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #070f15; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; }
        
        .header-input { display: flex; gap: 10px; margin-bottom: 15px; width: 100%; }
        .header-input input { flex: 1; background: #0d1925; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; outline: none; }
        .header-input button { background: #22c55e; border: none; padding: 0 20px; border-radius: 8px; color: #022c22; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; }
        
        .card { background: #0d1925; border: 1px solid #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 12px; }
        .card h2 { font-size: 13px; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; border-bottom: 1px solid #1e293b; padding-bottom: 5px; }
        
        #statusIndicatorCard { font-size: 16px; font-weight: bold; color: #ef4444; }
        
        .info-grid { display: flex; flex-direction: column; gap: 8px; }
        .info-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; }
        .info-row span { color: #64748b; }
        .info-row strong { color: #f1f5f9; }
        
        .map-container { width: 100%; height: 260px; border-radius: 8px; background: #040a0f; margin-top: 5px; z-index: 1; }
        .btn-gmaps { display: none; background: #0284c7; color: #fff; text-align: center; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; margin-top: 10px; width: 100%; }
        
        .cam-live { height: 140px; display: flex; align-items: center; justify-content: center; border: 2px dashed #1e293b; border-radius: 8px; color: #475569; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header-input">
        <input id="deviceId" placeholder="NX-51830E60">
        <button id="status" onclick="connectDevice()">CONNECT</button>
    </div>

    <div class="card">
        <h2>Device Status</h2>
        <div id="statusIndicatorCard">● DESCONECTADO</div>
    </div>

    <div class="card">
        <h2>Device Info</h2>
        <div class="info-grid">
            <div class="info-row"><span>ID:</span><strong id="deviceInfo">---</strong></div>
            <div class="info-row"><span>Bateria:</span><strong id="battery">---</strong></div>
            <div class="info-row"><span>Sistema:</span><strong id="android">---</strong></div>
            <div class="info-row"><span>Espaço:</span><strong id="storage">---</strong></div>
            <div class="info-row"><span>Uptime:</span><strong id="uptime">---</strong></div>
        </div>
    </div>

    <div class="card">
        <h2>GPS Localization</h2>
        <div id="map" class="map-container"></div>
        <a id="googleMapsBtn" href="#" target="_blank" class="btn-gmaps">ABRIR NO GOOGLE MAPS</a>
    </div>

    <div class="card">
        <h2>Front Camera</h2>
        <div class="cam-live">STREAM OFF</div>
    </div>

    <div class="card">
        <h2>Rear Camera</h2>
        <div class="cam-live">STREAM OFF</div>
    </div>

    <script src="app.js"></script>
</body>
</html>
